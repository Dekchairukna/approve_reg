<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>รายงานผลการแข่งขัน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Sarabun:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="band">
  <div class="wrap">
    <div class="band-top">
      <div class="brand" id="brand"><div class="logo-ph"></div><div><div class="games">&nbsp;</div><h1>รายงานผลการแข่งขัน</h1></div></div>
      <div class="staffbar" id="staffbar"></div>
    </div>
  </div>
</header>
<main><div class="wrap" id="app"><div class="loading">กำลังโหลด…</div></div></main>
<div class="toast" id="toast" hidden></div>

<script src="/static/common.js"></script>
<script>
(function () {
  var esc = C.esc, app = document.getElementById('app');
  var slug = decodeURIComponent(location.pathname.split('/')[2] || '');
  var MED = { gold: 'ทอง', silver: 'เงิน', bronze: 'ทองแดง' };
  var R = { d: null, tab: 'school', level: '', q: '', evLevel: '' };
  try { R.tab = C.store('res_tab') || 'school'; } catch (e) {}

  function medal(m) { return '<span class="medal ' + m + '">' + MED[m] + '</span>'; }
  function shortSchool(s) { return (s || '').replace(/^โรงเรียน/, ''); }

  function load() {
    C.http('GET', '/api/c/' + encodeURIComponent(slug) + '/results').then(function (d) {
      R.d = d;
      var c = d.comp;
      document.title = 'ผลการแข่งขัน · ' + c.name;
      document.getElementById('brand').innerHTML = C.logoHtml(c, 'logo') + '<div><div class="games">' + esc(c.name) + '</div><h1>รายงานผลการแข่งขัน' + esc(c.sport ? ' ' + c.sport : '') + '</h1></div>';
      draw();
    }).catch(function (e) { app.innerHTML = '<div class="errors">' + esc((e && e.message) || e) + '</div>'; });
  }

  function draw() {
    var d = R.d, p = d.progress;
    var tabs = [['school', 'ตามสถาบัน'], ['person', 'รายบุคคล'], ['event', 'รายรายการ']];
    app.innerHTML = '<section class="card" style="display:grid;gap:12px">' +
      '<div class="row between"><span class="small muted">บันทึกผลแล้ว ' + p.withResult + ' / ' + p.events + ' รายการ · ข้อมูล ณ ' +
      new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) + ' น.</span><button class="btn" id="rf">รีเฟรช</button></div>' +
      '<div class="subtabs" role="tablist">' + tabs.map(function (t) { return '<button role="tab" data-t="' + t[0] + '" aria-selected="' + (t[0] === R.tab) + '">' + t[1] + '</button>'; }).join('') + '</div>' +
      '<div id="body"></div></section>';
    document.getElementById('rf').onclick = load;
    app.querySelectorAll('.subtabs button').forEach(function (b) {
      b.onclick = function () { R.tab = b.getAttribute('data-t'); C.store('res_tab', R.tab); draw(); };
    });
    ({ school: drawSchool, person: drawPerson, event: drawEvent }[R.tab] || drawSchool)();
  }

  function levelBtns(cur, key) {
    var lvs = []; R.d.events.forEach(function (e) { if (e.level && lvs.indexOf(e.level) < 0) lvs.push(e.level); });
    R.d.table.forEach(function (t) { if (t.level && lvs.indexOf(t.level) < 0) lvs.push(t.level); });
    if (lvs.length < 2) return '';
    return '<div class="ck-filter" role="group" data-k="' + key + '">' + [['', 'ทุกระดับ']].concat(lvs.map(function (l) { return [l, C.levelLabel(l)]; })).map(function (l) {
      return '<button data-l="' + esc(l[0]) + '" aria-pressed="' + (cur === l[0]) + '">' + esc(l[1]) + '</button>';
    }).join('') + '</div>';
  }
  function bindLevels(key, fn) {
    document.querySelectorAll('[data-k="' + key + '"] button').forEach(function (b) { b.onclick = function () { R[key] = b.getAttribute('data-l'); fn(); }; });
  }
  var body = function () { return document.getElementById('body'); };
  var empty = '<p class="muted">ยังไม่มีการบันทึกผลการแข่งขัน</p>';

  function drawSchool() {
    var rows = R.d.table.filter(function (t) { return t.level === R.level; });
    var sum = { gold: 0, silver: 0, bronze: 0, total: 0 }, prev = null, rank = 0;
    body().innerHTML = '<div style="display:grid;gap:10px">' + levelBtns(R.level, 'level') +
      (rows.length ? '<div class="tbl-wrap"><table class="t medals"><thead><tr><th>อันดับ</th><th style="text-align:left">สถาบัน</th><th>' + medal('gold') + '</th><th>' + medal('silver') + '</th><th>' + medal('bronze') + '</th><th>รวม</th></tr></thead><tbody>' +
        rows.map(function (t, i) {
          var key = t.gold + '-' + t.silver + '-' + t.bronze;
          if (key !== prev) { rank = i + 1; prev = key; }
          ['gold', 'silver', 'bronze', 'total'].forEach(function (k) { sum[k] += t[k]; });
          return '<tr><td class="num">' + rank + '</td><td>' + esc(shortSchool(t.school)) + '</td><td class="num">' + t.gold + '</td><td class="num">' + t.silver + '</td><td class="num">' + t.bronze + '</td><td class="num"><b>' + t.total + '</b></td></tr>';
        }).join('') + '</tbody><tfoot><tr><th></th><th style="text-align:left">รวม</th><th class="num">' + sum.gold + '</th><th class="num">' + sum.silver + '</th><th class="num">' + sum.bronze + '</th><th class="num">' + sum.total + '</th></tr></tfoot></table></div>' +
        '<p class="hint" style="margin:0">นับเหรียญต่อทีม/คู่ (ไม่นับซ้ำตามจำนวนคน) เรียงตามเหรียญทอง เงิน ทองแดง</p>' : empty) + '</div>';
    bindLevels('level', drawSchool);
  }

  function drawPerson() {
    var q = R.q.trim().toLowerCase(), map = {}, list = [];
    R.d.people.forEach(function (p) {
      if (R.level && p.level !== R.level) return;
      var k = p.school + '|' + p.name.replace(/\s+/g, '');
      if (!map[k]) { map[k] = { name: p.name, school: p.school, gold: 0, silver: 0, bronze: 0, items: [] }; list.push(map[k]); }
      map[k][p.medal]++; map[k].items.push(p);
    });
    var ord = { gold: 0, silver: 1, bronze: 2 };
    list.forEach(function (x) { x.total = x.gold + x.silver + x.bronze; x.items.sort(function (a, b) { return ord[a.medal] - ord[b.medal]; }); });
    list.sort(function (a, b) { return b.gold - a.gold || b.silver - a.silver || b.bronze - a.bronze || a.name.localeCompare(b.name, 'th'); });
    var prev = null, rank = 0;
    list.forEach(function (x, i) { var key = x.gold + '-' + x.silver + '-' + x.bronze; if (key !== prev) { rank = i + 1; prev = key; } x.rank = rank; });
    var shown = list.filter(function (x) {
      return !q || (x.name + ' ' + x.school + ' ' + x.items.map(function (p) { return p.short; }).join(' ')).toLowerCase().indexOf(q) >= 0;
    });
    body().innerHTML = '<div style="display:grid;gap:10px"><div class="row"><input type="search" id="q" placeholder="ค้นหาชื่อนักกีฬา โรงเรียน หรือรายการ" value="' + esc(R.q) + '" style="flex:1;min-width:180px">' + levelBtns(R.level, 'level') + '</div>' +
      (shown.length ? '<div class="tbl-wrap"><table class="t medals pmed"><thead><tr><th>อันดับ</th><th style="text-align:left">ชื่อ-นามสกุล</th><th>' + medal('gold') + '</th><th>' + medal('silver') + '</th><th>' + medal('bronze') + '</th><th>รวม</th></tr></thead><tbody>' +
        shown.map(function (x) {
          return '<tr><td class="num">' + x.rank + '</td><td><b>' + esc(x.name) + '</b><div class="small muted">' + esc(shortSchool(x.school)) + '</div>' +
            '<div class="small pm-items">' + x.items.map(function (p) { return '<span><i class="dot ' + p.medal + '"></i>' + esc(C.levelLabel(p.level) + ' ' + p.short) + '</span>'; }).join('') + '</div></td>' +
            '<td class="num">' + x.gold + '</td><td class="num">' + x.silver + '</td><td class="num">' + x.bronze + '</td><td class="num"><b>' + x.total + '</b></td></tr>';
        }).join('') + '</tbody></table></div>' +
        '<p class="hint" style="margin:0">เรียงตามจำนวนเหรียญทอง ถ้าเท่ากันดูเหรียญเงิน แล้วเหรียญทองแดง · นักกีฬาทุกคนในทีมที่ได้รางวัล (รวมตัวสำรอง) นับรางวัลเท่ากัน</p>'
        : (list.length ? '<p class="muted">ไม่พบรายชื่อที่ค้นหา</p>' : empty)) + '</div>';
    var inp = document.getElementById('q');
    inp.oninput = function () { R.q = this.value; var pos = this.selectionStart; drawPerson(); var n = document.getElementById('q'); n.focus(); n.setSelectionRange(pos, pos); };
    bindLevels('level', drawPerson);
  }

  function drawEvent() {
    var evs = R.d.events.filter(function (e) { return !R.level || e.level === R.level; });
    body().innerHTML = '<div style="display:grid;gap:10px">' + levelBtns(R.level, 'level') +
      (evs.length ? evs.map(function (e) {
        return '<div class="res-ev"><h3>' + esc(C.levelLabel(e.level) + ' · ' + e.short) + (e.startDate ? ' <span class="small muted">' + esc(C.thDate(e.startDate)) + '</span>' : '') + '</h3>' +
          e.winners.map(function (u) {
            return '<div class="res-row">' + medal(u.medal) + '<div><b>' + esc(shortSchool(u.school)) + '</b>' + (u.label !== 'บุคคล' ? ' <span class="small muted">' + esc(u.label) + '</span>' : '') +
              '<div class="small">' + esc(u.members.join(', ')) + '</div></div></div>';
          }).join('') + '</div>';
      }).join('') : empty) + '</div>';
    bindLevels('level', drawEvent);
  }

  load();
  setInterval(function () { if (!document.hidden && R.d && (document.activeElement || {}).id !== 'q') load(); }, 60000);
})();
</script>
</body>
</html>
