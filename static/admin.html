<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>หลังบ้านเจ้าหน้าที่</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Sarabun:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="band">
  <div class="wrap">
    <div class="band-top">
      <div><div class="games">ระบบยืนยันรายชื่อนักกีฬา</div><h1>หลังบ้านเจ้าหน้าที่</h1></div>
      <div class="staffbar" id="who"></div>
    </div>
    <nav class="nav" id="nav"></nav>
  </div>
</header>
<main><div class="wrap" id="app"><div class="loading">กำลังโหลด…</div></div></main>
<div id="printArea"></div>
<div class="toast" id="toast" hidden></div>

<script src="/static/common.js"></script>
<script>
(function () {
  var esc = C.esc, thDate = C.thDate, thDateTime = C.thDateTime, http = C.http;
  var A = { me: null, comp: null, events: [], schools: [], printHtml: '' };
  var app = document.getElementById('app');
  function errMsg(e) { return (e && (e.message || e)) + ''; }
  function isAdmin() { return A.me && A.me.role === 'admin'; }
  function fail(e) { if (e && e.status === 401) { A.me = null; boot(); return; } C.toast(errMsg(e)); }
  function go(h) { if (location.hash === '#' + h) route(); else location.hash = h; }
  window.addEventListener('hashchange', route);

  /* ---------- เข้าสู่ระบบ ---------- */
  function boot() {
    http('GET', '/api/auth/me').then(function (d) {
      A.me = d.user;
      if (d.needsSetup) return renderSetup();
      if (!A.me) return renderLogin();
      renderShell(); route();
    }).catch(function (e) { app.innerHTML = '<div class="errors">' + esc(errMsg(e)) + '</div>'; });
  }
  function bare() { document.getElementById('nav').innerHTML = ''; document.getElementById('who').innerHTML = '<a href="/">หน้ารายการแข่งขัน</a>'; }
  function renderSetup(msg) {
    bare();
    app.innerHTML = '<section class="card center-card" style="display:grid;gap:12px"><h2>ตั้งค่าครั้งแรก</h2>' +
      '<p class="small muted" style="margin:0">สร้างบัญชีผู้ดูแลระบบ (admin) คนแรก ใช้จัดการการแข่งขันและบัญชีเจ้าหน้าที่คนอื่น</p>' +
      (msg ? '<div class="errors">' + esc(msg) + '</div>' : '') +
      '<label class="f">ชื่อที่แสดง<input type="text" id="s_name" placeholder="เช่น ครูสมชาย"></label>' +
      '<label class="f">ชื่อผู้ใช้ (อังกฤษ)<input type="text" id="s_user" autocomplete="username" autocapitalize="off"></label>' +
      '<label class="f">รหัสผ่าน (อย่างน้อย 8 ตัว)<input type="password" id="s_pw" autocomplete="new-password"></label>' +
      '<button class="btn primary" id="s_go">สร้างบัญชีและเข้าสู่ระบบ</button>' +
      '<div style="border-top:1px solid var(--line);padding-top:12px;display:grid;gap:8px"><b>หรือ ย้ายข้อมูลจากเครื่องอื่น</b>' +
      '<p class="small muted" style="margin:0">ถ้าเคยใช้ระบบนี้ในเครื่องอื่นแล้ว เลือกไฟล์ <code>instance/checkin.db</code> จากเครื่องนั้น ระบบจะย้ายการแข่งขัน รายชื่อ โลโก้ และบัญชีผู้ใช้เดิมมาทั้งหมด แล้วเข้าสู่ระบบด้วยบัญชีเดิมได้เลย</p>' +
      '<input type="file" id="s_file" accept=".db,.sqlite,.sqlite3,application/octet-stream"><button class="btn" id="s_restore">กู้คืนจากไฟล์</button></div></section>';
    document.getElementById('s_restore').onclick = function () {
      var f = document.getElementById('s_file').files[0]; if (!f) { C.toast('เลือกไฟล์ checkin.db ก่อน'); return; }
      var fd = new FormData(); fd.append('file', f);
      this.disabled = true; this.textContent = 'กำลังกู้คืน…';
      http('POST', '/api/auth/restore', fd).then(function (d) {
        renderLogin(null, 'กู้คืนแล้ว: ' + d.counts.competitions + ' การแข่งขัน ' + d.counts.entries + ' รายชื่อ ' + d.counts.users + ' บัญชี เข้าสู่ระบบด้วยบัญชีเดิมได้เลย');
      }).catch(function (e) { renderSetup(errMsg(e)); });
    };
    document.getElementById('s_go').onclick = function () {
      http('POST', '/api/auth/setup', { name: val('s_name'), username: val('s_user'), password: document.getElementById('s_pw').value })
        .then(boot).catch(function (e) { renderSetup(errMsg(e)); });
    };
  }
  function renderLogin(msg, ok) {
    bare();
    app.innerHTML = '<section class="card center-card" style="display:grid;gap:12px"><h2>เข้าสู่ระบบเจ้าหน้าที่</h2>' +
      (msg ? '<div class="errors">' + esc(msg) + '</div>' : '') + (ok ? '<div class="confirmed">' + esc(ok) + '</div>' : '') +
      '<label class="f">ชื่อผู้ใช้<input type="text" id="l_user" autocomplete="username" autocapitalize="off"></label>' +
      '<label class="f">รหัสผ่าน<input type="password" id="l_pw" autocomplete="current-password"></label>' +
      '<button class="btn primary" id="l_go">เข้าสู่ระบบ</button>' +
      '<p class="hint" style="margin:0">ลืมรหัสผ่าน: ให้ผู้ดูแลระบบตั้งให้ใหม่ หรือใช้คำสั่ง python3 manage.py reset-password ชื่อผู้ใช้</p></section>';
    var goLogin = function () {
      http('POST', '/api/auth/login', { username: val('l_user'), password: document.getElementById('l_pw').value })
        .then(boot).catch(function (e) { renderLogin(errMsg(e)); });
    };
    document.getElementById('l_go').onclick = goLogin;
    document.getElementById('l_pw').addEventListener('keydown', function (e) { if (e.key === 'Enter') goLogin(); });
  }
  function val(id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; }

  function renderShell() {
    document.getElementById('who').innerHTML = '<span><b>' + esc(A.me.name || A.me.username) + '</b> · ' + (isAdmin() ? 'ผู้ดูแลระบบ' : 'เจ้าหน้าที่') + '</span>' +
      '<button id="w_pw">เปลี่ยนรหัสผ่าน</button><button id="w_out">ออกจากระบบ</button>';
    document.getElementById('w_pw').onclick = function () { go('password'); };
    document.getElementById('w_out').onclick = function () { http('POST', '/api/auth/logout').then(function () { location.hash = ''; boot(); }); };
  }
  function setNav(cur) {
    var items = [['comps', 'การแข่งขัน']].concat(isAdmin() ? [['users', 'บัญชีเจ้าหน้าที่']] : []);
    document.getElementById('nav').innerHTML = items.map(function (i) {
      return '<button data-go="' + i[0] + '"' + (cur === i[0] ? ' aria-current="page"' : '') + '>' + i[1] + '</button>';
    }).join('');
    document.querySelectorAll('#nav button').forEach(function (b) { b.onclick = function () { go(b.getAttribute('data-go')); }; });
  }

  function route() {
    if (!A.me) return;
    hidePrint();
    var p = location.hash.replace(/^#/, '').split('/');
    if (p[0] === 'users' && isAdmin()) { setNav('users'); return renderUsers(); }
    if (p[0] === 'password') { setNav(''); return renderPassword(); }
    if (p[0] === 'new' && isAdmin()) { setNav('comps'); return renderNewComp(); }
    if (p[0] === 'comp' && p[1]) { setNav('comps'); return openComp(+p[1], p[2] || 'overview'); }
    setNav('comps'); renderComps();
  }

  /* ---------- รายการการแข่งขัน ---------- */
  function renderComps() {
    app.innerHTML = '<div class="loading">กำลังโหลด…</div>';
    http('GET', '/api/admin/competitions').then(function (d) {
      app.innerHTML = '<div class="row between"><h2>การแข่งขัน</h2>' + (isAdmin() ? '<button class="btn primary" id="newComp">+ สร้างการแข่งขันใหม่</button>' : '') + '</div>' +
        (d.competitions.length ? '<div class="comp-list">' + d.competitions.map(function (c) {
          var st = !c.active ? '<span class="pill off">ปิดใช้งาน</span>' : c.undated ? '<span class="pill wait">ยังไม่ตั้งวันแข่ง ' + c.undated + ' รายการ</span>' : '<span class="pill ok">เปิดใช้งาน</span>';
          return '<button class="comp" data-id="' + c.id + '">' + C.logoHtml(c, '') + '<div><div class="t">' + esc(c.name) + '</div>' +
            '<div class="s num">' + esc(c.sport ? 'กีฬา' + c.sport + ' · ' : '') + c.schools + ' โรงเรียน · ' + c.entries + ' รายชื่อ · ยืนยันแล้ว ' + c.confirmed + ' รายการ</div></div>' + st + '</button>';
        }).join('') + '</div>' : '<div class="card muted">ยังไม่มีการแข่งขัน' + (isAdmin() ? ' กด "สร้างการแข่งขันใหม่" แล้วอัปโหลดไฟล์ Excel รายชื่อนักกีฬา' : '') + '</div>');
      if (isAdmin()) {
        app.insertAdjacentHTML('beforeend', '<section class="card" style="display:grid;gap:10px;margin-top:6px"><h3>สำรอง / กู้คืนข้อมูลทั้งระบบ</h3>' +
          '<p class="small muted" style="margin:0">ไฟล์สำรองมีทุกการแข่งขัน รายชื่อ การยืนยัน ประวัติ โลโก้ และบัญชีผู้ใช้ ใช้ย้ายเครื่อง/ย้ายเซิร์ฟเวอร์ หรือเก็บไว้กันข้อมูลหาย <b>มีข้อมูลส่วนบุคคล เก็บให้ดี</b></p>' +
          '<div class="row"><a class="btn" href="/api/admin/backup" style="text-decoration:none">ดาวน์โหลดไฟล์สำรอง</a></div>' +
          '<form id="rsf" class="row"><input type="file" name="file" accept=".db,.sqlite,.sqlite3" required>' +
          '<label class="toggle"><input type="checkbox" name="confirm" value="yes"> แทนที่ข้อมูลทั้งหมดในระบบ</label><button class="btn danger" type="submit">กู้คืน</button></form></section>');
        document.getElementById('newComp').onclick = function () { go('new'); };
        document.getElementById('rsf').onsubmit = function (ev) {
          ev.preventDefault();
          http('POST', '/api/admin/restore', new FormData(ev.target)).then(function (d) {
            C.toast('กู้คืนแล้ว ' + d.counts.competitions + ' การแข่งขัน'); boot();
          }).catch(fail);
        };
      }
      app.querySelectorAll('.comp').forEach(function (b) { b.onclick = function () { go('comp/' + b.getAttribute('data-id')); }; });
    }).catch(fail);
  }

  function renderNewComp(msg) {
    app.innerHTML = '<section class="card" style="display:grid;gap:14px"><button class="btn link" id="back" style="justify-self:start">‹ กลับ</button>' +
      '<h2>สร้างการแข่งขันใหม่</h2>' + (msg ? '<div class="errors">' + esc(msg) + '</div>' : '') +
      '<form id="f" class="grid-form">' +
      '<label class="f wide">ชื่อการแข่งขัน<input type="text" name="name" required placeholder="เช่น การแข่งขันกีฬาสาธิตสามัคคี ครั้งที่ 49 “คำมอกหลวงเกมส์”"></label>' +
      '<label class="f">ชนิดกีฬา<input type="text" name="sport" placeholder="เช่น เปตอง"></label>' +
      '<label class="f">รหัสลิงก์ (อังกฤษตัวเล็ก)<input type="text" name="slug" required placeholder="เช่น petong49" autocapitalize="off"><span class="hint">ลิงก์จะเป็น /c/รหัสนี้</span></label>' +
      '<label class="f">จำนวนรายการสูงสุดต่อคน<input type="number" name="max_events" value="3" min="0"><span class="hint">0 = ไม่จำกัด</span></label>' +
      '<label class="f">คำอธิบายเพิ่มเติม (ถ้ามี)<input type="text" name="subtitle" placeholder="เช่น ม.ขอนแก่น 24–30 ต.ค. 2569"></label>' +
      '<label class="f wide">ไฟล์ Excel รายชื่อนักกีฬา<input type="file" name="file" accept=".xlsx" required>' +
      '<span class="hint">ต้องมีคอลัมน์: รายการแข่งขัน, โรงเรียน, คำนำหน้า, ชื่อ, นามสกุล, ระดับชั้น, คู่ที่/ทีมที่ (ใช้รูปแบบเดียวกับไฟล์จากระบบรับสมัคร)</span></label>' +
      '<label class="f wide">โลโก้ (ไม่บังคับ)<input type="file" name="logo" accept="image/*"></label>' +
      '<div class="wide"><button class="btn primary" type="submit" id="go">สร้างและนำเข้ารายชื่อ</button></div></form></section>';
    document.getElementById('back').onclick = function () { go('comps'); };
    document.getElementById('f').onsubmit = function (ev) {
      ev.preventDefault();
      var b = document.getElementById('go'); b.disabled = true; b.textContent = 'กำลังนำเข้า…';
      http('POST', '/api/admin/competitions', new FormData(ev.target)).then(function (d) {
        C.toast('นำเข้า ' + d.imported.entries + ' รายชื่อ ' + d.imported.events + ' รายการ ' + d.imported.schools + ' โรงเรียน');
        go('comp/' + d.id + '/schedule');
      }).catch(function (e) { if (e.status === 401) return fail(e); renderNewComp(errMsg(e)); });
    };
  }

  /* ---------- รายละเอียดการแข่งขัน ---------- */
  var TABS = [['overview', 'ภาพรวม'], ['checkin', 'รายงานตัว'], ['athletes', 'รายชื่อนักกีฬา'], ['print', 'พิมพ์ใบรายงานตัว'], ['schedule', 'วันแข่ง / เวลาปิด'], ['logs', 'ประวัติการแก้ไข'], ['settings', 'ตั้งค่า']];
  function openComp(id, tab) {
    var load = A.comp && A.comp.id === id ? Promise.resolve() : http('GET', '/api/admin/competitions/' + id).then(function (d) {
      A.comp = d.comp; A.events = d.events; A.schools = d.schools;
    });
    load.then(function () { renderComp(tab); }).catch(fail);
  }
  function reloadComp(tab) { A.comp = null; openComp(+location.hash.split('/')[1], tab); }
  function renderComp(tab) {
    var c = A.comp, link = location.origin + '/c/' + c.slug;
    var tabs = TABS.filter(function (t) { return isAdmin() || t[0] !== 'settings'; });
    app.innerHTML = '<div class="row between"><button class="btn link" id="back">‹ การแข่งขันทั้งหมด</button></div>' +
      '<section class="card" style="display:grid;gap:12px"><div class="row" style="flex-wrap:nowrap;align-items:flex-start">' + C.logoHtml(c, 'logo') +
      '<div style="min-width:0"><h2>' + esc(c.name) + '</h2><div class="small muted">' + esc([c.sport ? 'กีฬา' + c.sport : '', c.subtitle].filter(Boolean).join(' · ')) +
      (c.active ? '' : ' · <span class="danger">ปิดใช้งาน</span>') + '</div>' +
      '<div class="copy" style="margin-top:6px"><span class="muted">ลิงก์สำหรับโรงเรียน</span><code id="link">' + esc(link) + '</code>' +
      '<button class="btn" id="copyLink" style="padding:4px 10px">คัดลอก</button><a class="btn" href="/c/' + esc(c.slug) + '" target="_blank" rel="noopener" style="padding:4px 10px;text-decoration:none">เปิด</a></div></div></div>' +
      '<div class="subtabs" role="tablist">' + tabs.map(function (t) { return '<button role="tab" data-t="' + t[0] + '" aria-selected="' + (t[0] === tab) + '">' + t[1] + '</button>'; }).join('') + '</div>' +
      '<div id="tab"><div class="loading">กำลังโหลด…</div></div></section>';
    document.getElementById('back').onclick = function () { A.comp = null; go('comps'); };
    document.getElementById('copyLink').onclick = function () {
      navigator.clipboard.writeText(link).then(function () { C.toast('คัดลอกลิงก์แล้ว'); }, function () {
        var r = document.createRange(); r.selectNode(document.getElementById('link')); getSelection().removeAllRanges(); getSelection().addRange(r);
      });
    };
    app.querySelectorAll('.subtabs button').forEach(function (b) { b.onclick = function () { go('comp/' + c.id + '/' + b.getAttribute('data-t')); }; });
    ({ overview: tabOverview, checkin: tabCheckin, athletes: tabAthletes, print: tabPrint, schedule: tabSchedule, logs: tabLogs, settings: tabSettings }[tab] || tabOverview)();
  }
  function tabEl() { return document.getElementById('tab'); }

  function tabOverview() {
    var c = A.comp;
    http('GET', '/api/admin/competitions/' + c.id + '/overview').then(function (o) {
      var t = o.totals, pct = function (a, b) { return b ? Math.round(a / b * 100) : 0; };
      tabEl().innerHTML = '<div style="display:grid;gap:14px">' +
        '<div class="row between"><span class="small muted">ข้อมูล ณ ' + new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) + ' น.</span>' +
        '<div class="row"><button class="btn" id="refresh">รีเฟรช</button><a class="btn" href="/api/admin/competitions/' + c.id + '/export" style="text-decoration:none">ดาวน์โหลด Excel</a></div></div>' +
        '<div class="tiles"><div class="tile"><b>' + t.athletesConfirmed + '</b><span>นักกีฬายืนยันแล้ว (คน)</span></div>' +
        '<div class="tile"><b>' + t.pairsDone + '<small class="muted" style="font-size:15px"> / ' + t.pairsTotal + '</small></b><span>รายการที่ยืนยันแล้ว' + (t.pairsAuto ? ' (อัตโนมัติ ' + t.pairsAuto + ')' : '') + '</span></div>' +
        '<div class="tile"><b>' + t.entriesConfirmed + '</b><span>สิทธิ์ลงแข่งที่ยืนยัน (คน-รายการ)</span></div>' +
        '<div class="tile"><b>' + t.entriesWithdrawn + '</b><span>ไม่ส่ง (คน-รายการ)</span></div></div>' +
        (o.over.length ? '<div class="errors"><b>ยืนยันเกิน ' + c.max + ' รายการ</b><ul>' + o.over.map(function (p) { return '<li>' + esc(p.name + ' · ' + p.school + ' (' + p.events.join(', ') + ')') + '</li>'; }).join('') + '</ul></div>' : '') +
        '<h3>ตามวันแข่งขัน</h3><div class="tbl-wrap"><table class="t"><thead><tr><th>วันแข่ง</th><th>ประเภท</th><th>ปิดยืนยัน</th><th>ยืนยันแล้ว</th><th style="width:28%"></th></tr></thead><tbody>' +
        o.categories.map(function (k) {
          return '<tr><td>' + thDate(k.startDate) + '</td><td>' + esc(k.category) + '</td><td>' + thDateTime(k.deadline) + (k.closed ? ' <span class="pill off">ปิดแล้ว</span>' : '') + '</td>' +
            '<td class="num">' + k.done + '/' + k.total + '</td><td><div class="bar"><i style="width:' + pct(k.done, k.total) + '%"></i></div></td></tr>';
        }).join('') + '</tbody></table></div>' +
        '<h3>รายโรงเรียน</h3><div class="tbl-wrap"><table class="t"><thead><tr><th>โรงเรียน</th><th>ยืนยัน</th><th>นักกีฬา</th><th>อัปเดตล่าสุด</th></tr></thead><tbody>' +
        o.schools.map(function (s) {
          var base = '/c/' + encodeURIComponent(c.slug) + '#s=' + encodeURIComponent(s.school);
          return '<tr><td style="min-width:240px"><a href="' + base + '" target="_blank" rel="noopener">' + esc(s.school) + '</a><div class="evgrid">' + s.events.map(function (e) {
            return '<a class="' + (e.done ? 'y' : 'n') + '" href="' + base + '&e=' + encodeURIComponent(e.event) + '" target="_blank" rel="noopener" title="' + esc('กดเพื่อแก้ไข · ' + e.event + (e.done ? ' · ' + e.by + ' ' + e.phone : '')) + '">' + esc(C.levelLabel(e.level) + ' ' + e.short) + '</a>';
          }).join('') + '</div></td><td class="num">' + s.done + '/' + s.total + '<div class="bar"><i style="width:' + pct(s.done, s.total) + '%"></i></div></td>' +
            '<td class="num">' + s.athletes + '</td><td class="small">' + esc(s.last ? thDateTime(s.last) : '–') + '</td></tr>';
        }).join('') + '</tbody></table></div>' +
        '<p class="hint" style="margin:0">แก้รายชื่อแทนโรงเรียน (แก้ได้แม้เลยเวลาปิด): กดชื่อโรงเรียน หรือกดชื่อรายการ ระบบจะเปิดหน้าแก้ไขในแท็บใหม่</p></div>';
      document.getElementById('refresh').onclick = tabOverview;
    }).catch(fail);
  }

  function loadCheckin(quiet) {
    var list = document.getElementById('ckList'); if (!list) return;
    if (!CK.sel.length) { CK.data = null; document.getElementById('ckSum').innerHTML = ''; list.innerHTML = '<p class="muted">เลือกรายการแข่งขันด้านบนก่อน (เลือกได้หลายรายการ)</p>'; return; }
    var qs = CK.sel.map(function (n) { return 'event=' + encodeURIComponent(n); }).join('&'), want = qs;
    http('GET', '/api/admin/competitions/' + A.comp.id + '/checkin?' + qs).then(function (d) {
      if (want !== CK.sel.map(function (n) { return 'event=' + encodeURIComponent(n); }).join('&')) return;   // เลือกเปลี่ยนระหว่างโหลด
      CK.data = d; drawCheckin();
    }).catch(function (e) { if (!quiet) fail(e); });
  }
  function drawCheckin() {
    var d = CK.data, list = document.getElementById('ckList'); if (!d || !list) return;
    // รวมเป็นรายคน: เด็กคนเดียวที่ลงหลายรายการที่เลือก แสดงแถวเดียว
    var people = {}, order = [];
    d.rows.forEach(function (r) {
      var p = people[r.key];
      if (!p) { p = people[r.key] = { key: r.key, school: r.school, name: r.name, items: [] }; order.push(r.key); }
      p.items.push(r);
    });
    var all = order.map(function (k) { var p = people[k]; p.done = p.items.every(function (r) { return r.checkinAt; }); p.some = p.items.some(function (r) { return r.checkinAt; }); return p; });
    var q = C.norm(CK.q);
    var shown = all.filter(function (p) {
      if (CK.filter === 'wait' && p.done) return false;
      if (CK.filter === 'done' && !p.done) return false;
      return !q || C.norm(p.name + p.school).indexOf(q) >= 0;
    });
    var present = all.filter(function (p) { return p.done; }).length, pct = all.length ? Math.round(present / all.length * 100) : 0;
    document.getElementById('ckSum').innerHTML = '<div class="tile" style="gap:6px"><div class="row between"><span><b style="font-size:24px" class="num">' + present + '</b> <span class="muted">/ ' + all.length + ' คน มารายงานตัวแล้ว</span></span>' +
      '<span class="small muted">อัปเดตเองทุก 20 วินาที</span></div><div class="bar"><i style="width:' + pct + '%"></i></div></div>' +
      (d.unconfirmed.length ? '<details class="locked small" style="margin-top:8px"><summary>ยังไม่ยืนยันรายชื่อ ' + d.unconfirmed.length + ' รายการ (ไม่มีในรายการด้านล่าง) · กดดู</summary>' +
        d.unconfirmed.map(function (u) { return esc(u.school + ' · ' + C.levelLabel(u.level) + ' ' + u.short); }).join('<br>') + '</details>' : '');
    if (!shown.length) { list.innerHTML = '<p class="muted">' + (all.length ? 'ไม่พบรายชื่อตามที่ค้นหา' : 'ยังไม่มีโรงเรียนยืนยันรายชื่อในรายการที่เลือก') + '</p>'; return; }
    var bySchool = {}, sorder = [];
    shown.forEach(function (p) { if (!bySchool[p.school]) { bySchool[p.school] = []; sorder.push(p.school); } bySchool[p.school].push(p); });
    var multi = CK.sel.length > 1;
    list.innerHTML = sorder.map(function (s) {
      var mates = all.filter(function (p) { return p.school === s; }), n = mates.filter(function (p) { return p.done; }).length;
      return '<section class="ck-school"><div class="ck-head"><b>' + esc(s) + '</b><span class="pill ' + (n === mates.length ? 'ok' : 'wait') + ' num">' + n + '/' + mates.length + '</span></div>' +
        bySchool[s].map(function (p) {
          var tags = p.items.map(function (r) { return (multi ? C.levelLabel(r.level) + ' ' + r.short + ' · ' : '') + r.teamLabel + (r.auto ? ' (ยืนยันอัตโนมัติ)' : ''); }).join(' | ');
          var first = p.items.filter(function (r) { return r.checkinAt; })[0];
          return '<div class="ck-row' + (p.done ? ' done' : '') + '"><div class="ck-name"><span class="small muted">' + esc(tags) + '</span><b>' + esc(p.name) + '</b>' +
            (first ? '<span class="small" style="color:var(--ok)">' + (p.done ? 'มาแล้ว ' : 'มาแล้วบางรายการ ') + esc(first.checkinAt.slice(11, 16)) + ' น. · ' + esc(first.checkinBy) + '</span>' : '') + '</div>' +
            '<button class="btn ' + (p.done ? '' : 'primary') + ' ck-btn" data-k="' + esc(p.key) + '">' + (p.done ? 'ยกเลิก' : 'รายงานตัว') + '</button></div>';
        }).join('') + '</section>';
    }).join('');
    list.querySelectorAll('.ck-btn').forEach(function (b) {
      b.onclick = function () {
        var p = people[b.getAttribute('data-k')], on = !p.done;
        if (!on && !window.confirm('ยกเลิกการรายงานตัวของ ' + p.name + '?')) return;
        var ids = p.items.filter(function (r) { return on ? !r.checkinAt : true; }).map(function (r) { return r.id; });
        b.disabled = true;
        http('POST', '/api/admin/competitions/' + A.comp.id + '/checkin', { ids: ids, present: on }).then(function (res) {
          CK.data.rows.forEach(function (r) { if (res.ids.indexOf(r.id) >= 0) { r.checkinAt = res.checkinAt; r.checkinBy = res.checkinBy; } });
          drawCheckin();
        }).catch(function (e) { b.disabled = false; fail(e); });
      };
    });
  }

  /* รายงานการรายงานตัว แยกตามรายการ: มาแล้วเรียงตามเวลา ตามด้วยยังไม่มา */
  function printCheckinReport() {
    var d = CK.data; if (!d || !d.rows.length) { C.toast('ยังไม่มีรายชื่อในรายการที่เลือก'); return; }
    var em = {}; A.events.forEach(function (e) { em[e.event] = e; });
    var logo = A.comp.logo ? '<img class="plogo" src="' + location.origin + esc(A.comp.logo) + '" alt="">' : '';
    var now = new Date(Date.now() + 7 * 36e5).toISOString().slice(0, 16).replace('T', ' ');
    var html = A.events.filter(function (e) { return d.events.indexOf(e.event) >= 0; }).map(function (ev) {
      var rows = d.rows.filter(function (r) { return r.event === ev.event; });
      if (!rows.length) return '';
      rows.sort(function (a, b) {
        if (!!a.checkinAt !== !!b.checkinAt) return a.checkinAt ? -1 : 1;
        return a.checkinAt ? a.checkinAt.localeCompare(b.checkinAt) : (a.school + a.name).localeCompare(b.school + b.name, 'th');
      });
      var n = rows.filter(function (r) { return r.checkinAt; }).length;
      return '<div class="sheet">' + logo + '<div class="hd"><h2>รายงานการรายงานตัวนักกีฬา</h2><div>' + esc(A.comp.name) + '</div></div>' +
        '<div class="meta"><b>รายการ</b><span>' + esc(C.levelLabel(ev.level) + ' · ' + ev.short) + ' <span style="color:#555">(' + esc(ev.event) + ')</span></span>' +
        (ev.startDate ? '<b>วันแข่ง</b><span>' + esc(thDate(ev.startDate, true)) + (ev.startTime ? ' เริ่ม ' + esc(ev.startTime) + ' น.' : '') + '</span>' : '') +
        '<b>สรุป</b><span>มารายงานตัว ' + n + ' / ' + rows.length + ' คน' + (rows.length - n ? ' · ยังไม่มา ' + (rows.length - n) + ' คน' : '') + '</span></div>' +
        '<table><thead><tr><th class="c">ที่</th><th>ชื่อ-นามสกุล</th><th>โรงเรียน</th><th>ทีม/คู่</th><th style="width:30mm">เวลา</th></tr></thead><tbody>' +
        rows.map(function (r, i) {
          return '<tr><td class="c">' + (i + 1) + '</td><td>' + esc(r.name) + '</td><td>' + esc(r.school) + '</td><td>' + esc(r.teamLabel) + '</td>' +
            '<td>' + (r.checkinAt ? esc(r.checkinAt.slice(11, 16)) + ' น.' : '<span style="color:#b00">ยังไม่มา</span>') + '</td></tr>';
        }).join('') + '</tbody></table><div class="foot">พิมพ์เมื่อ ' + esc(now) + ' น.</div></div>';
    }).join('');
    openPrintWindow(html, 'รายงานการรายงานตัว');
  }

  function tabAthletes() {

      (isAdmin() ? '' : ' (บัญชีเจ้าหน้าที่ดูได้อย่างเดียว ผู้ดูแลระบบเป็นคนแก้)') + '</p>' +

  var ATH = [];
  function loadAthletes() {
    var s = document.getElementById('athSchool').value;
    http('GET', '/api/admin/competitions/' + A.comp.id + '/athletes?school=' + encodeURIComponent(s)).then(function (d) { ATH = d.athletes; drawAthletes(); }).catch(fail);
  }
  function drawAthletes() {
    var q = C.norm(document.getElementById('athQ').value), ro = !isAdmin(), dis = ro ? ' disabled' : '';
    var rows = ATH.filter(function (a) { return !q || C.norm(a.prefix + a.first + a.last).indexOf(q) >= 0; });
    var pre = ['ด.ช.', 'ด.ญ.', 'นาย', 'น.ส.', 'นาง'];
    document.getElementById('athList').innerHTML = '<p class="small muted">' + ATH.length + ' คน</p>' + (rows.length ? rows.map(function (a, i) {
      var opts = pre.indexOf(a.prefix) < 0 && a.prefix ? pre.concat([a.prefix]) : pre;
      return '<div class="ath-row" data-k="' + esc(a.key) + '"><div class="ath-f">' +
        '<select class="a-pre"' + dis + '>' + opts.map(function (p) { return '<option' + (p === a.prefix ? ' selected' : '') + '>' + esc(p) + '</option>'; }).join('') + '</select>' +
        '<input type="text" class="a-first" value="' + esc(a.first) + '"' + dis + '><input type="text" class="a-last" value="' + esc(a.last) + '"' + dis + '>' +
        (ro ? '' : '<button class="btn a-save">บันทึก</button>') + '</div>' +
        '<div class="small muted">' + (a.events.length ? esc(a.events.join(' · ')) : 'ไม่ได้ลงรายการ / ไม่ส่ง') + '</div></div>';
    }).join('') : '<p class="muted">ไม่พบชื่อ</p>');
    document.querySelectorAll('.a-save').forEach(function (b) {
      b.onclick = function () {
        var row = b.closest('.ath-row'), a = ATH.filter(function (x) { return x.key === row.getAttribute('data-k'); })[0];
        var body = { school: document.getElementById('athSchool').value, key: a.key, prefix: row.querySelector('.a-pre').value,
          first: row.querySelector('.a-first').value, last: row.querySelector('.a-last').value };
        if (body.prefix === a.prefix && body.first.trim() === a.first && body.last.trim() === a.last) { C.toast('ชื่อไม่ได้เปลี่ยน'); return; }
        b.disabled = true;
        http('POST', '/api/admin/competitions/' + A.comp.id + '/athletes/rename', body).then(function (r) {
          C.toast('แก้ชื่อแล้ว (' + r.updated + ' รายการ)'); loadAthletes();
        }).catch(function (e) { b.disabled = false; fail(e); });
      };
    });
  }

        b.onclick = function () {
          if (!window.confirm('ลบบัญชี ' + b.getAttribute('data-name') + ' ? (ประวัติการแก้ไขเดิมยังเก็บชื่อบัญชีไว้)')) return;
          http('POST', '/api/admin/users/' + b.closest('tr').getAttribute('data-id') + '/delete')
            .then(function () { C.toast('ลบบัญชีแล้ว'); renderUsers(); }).catch(function (e) { if (e.status === 401) return fail(e); renderUsers(errMsg(e)); });
        };
      });
      document.getElementById('uf').onsubmit = function (ev) {
        ev.preventDefault();
        var o = {}; new FormData(ev.target).forEach(function (v, k) { o[k] = v; });
        http('POST', '/api/admin/users', o).then(function () { C.toast('เพิ่มบัญชีแล้ว'); renderUsers(); })
          .catch(function (e) { if (e.status === 401) return fail(e); renderUsers(errMsg(e)); });
      };
    }).catch(fail);
  }

  function renderPassword(msg) {
    app.innerHTML = '<section class="card center-card" style="display:grid;gap:12px"><h2>เปลี่ยนรหัสผ่าน</h2>' + (msg ? '<div class="errors">' + esc(msg) + '</div>' : '') +
      '<label class="f">รหัสผ่านปัจจุบัน<input type="password" id="pw0" autocomplete="current-password"></label>' +
      '<label class="f">รหัสผ่านใหม่ (อย่างน้อย 8 ตัว)<input type="password" id="pw1" autocomplete="new-password"></label>' +
      '<button class="btn primary" id="pwGo">บันทึก</button></section>';
    document.getElementById('pwGo').onclick = function () {
      http('POST', '/api/auth/password', { current: document.getElementById('pw0').value, 'new': document.getElementById('pw1').value })
        .then(function () { C.toast('เปลี่ยนรหัสผ่านแล้ว'); go('comps'); }).catch(function (e) { renderPassword(errMsg(e)); });
    };
  }

  boot();
})();
</script>
</body>
</html>
