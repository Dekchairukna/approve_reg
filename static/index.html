<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ยืนยันรายชื่อนักกีฬา</title>
<!--og-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Sarabun:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="band">
  <div class="wrap">
    <div class="band-top">
      <div class="brand" id="brand"><div class="logo-ph"></div><div><div class="games">&nbsp;</div><h1>ยืนยันรายชื่อนักกีฬา</h1></div></div>
      <div class="staffbar" id="staffbar"></div>
    </div>
    <nav class="nav pagenav" id="pagenav"></nav>
    <div class="deadlines" id="deadlines"></div>
  </div>
</header>
<main><div class="wrap" id="app"><div class="loading">กำลังโหลดข้อมูล…</div></div></main>
<div class="toast" id="toast" hidden></div>

<script src="/static/common.js"></script>
<script>
(function () {
  var esc = C.esc, norm = C.norm, thDate = C.thDate, thDateTime = C.thDateTime;
  var ST = { PENDING: 'รอยืนยัน', OK: 'ยืนยัน', OUT: 'ถอนตัว' };
  var slug = decodeURIComponent(location.pathname.split('/')[2] || '');
  var base = '/api/c/' + encodeURIComponent(slug);
  var S = { comp: null, schools: [], events: [], levels: [], staff: null, view: null, level: '', ev: null, draft: null, errors: [] };
  var app = document.getElementById('app');
  function pkey(f, l) { return norm(f) + norm(l); }
  function errMsg(e) { return (e && (e.message || e)) + ''; }

  function pageNav(slug, cur) {
    var b = '/c/' + encodeURIComponent(slug);
    document.getElementById('pagenav').innerHTML = [[b, 'confirm', 'ยืนยันรายชื่อนักกีฬา'], [b + '/results', 'results', 'ผลการแข่งขัน']].map(function (x) {
      return '<a href="' + x[0] + '"' + (x[1] === cur ? ' aria-current="page"' : '') + '>' + x[2] + '</a>';
    }).join('');
  }
  function renderHeader() {
    var c = S.comp;
    pageNav(c.slug, 'confirm');
    document.title = 'ยืนยันรายชื่อ · ' + c.name;
    document.getElementById('brand').innerHTML = C.logoHtml(c) +
      '<div><div class="games">' + esc(c.name) + '</div><h1>ยืนยันรายชื่อนักกีฬา' + esc(c.sport || '') + '</h1></div>';
    document.getElementById('staffbar').innerHTML = S.staff
      ? '<span>เจ้าหน้าที่: <b>' + esc(S.staff) + '</b></span><a href="/admin">หลังบ้าน</a>' : '';
  }
  function renderDeadlines() {
    document.getElementById('deadlines').innerHTML = C.days(S.events).map(function (d) {
      var ms = C.toMs(d.deadline), open = isNaN(ms) || Date.now() <= ms;
      return '<div class="dl ' + (open ? 'open' : 'closed') + '"><b>' + esc(d.cats.join(' · ')) + '</b>' +
        '<span class="when">แข่ง ' + thDate(d.startDate) + '</span>' +
        '<span class="when">ปิดยืนยัน ' + thDateTime(d.deadline) + '</span>' +
        '<span class="st num">' + (isNaN(ms) ? 'เปิดรับยืนยัน' : open ? C.left(ms) : 'ปิดรับแล้ว') + '</span></div>';
    }).join('');
  }

  /* ขั้นที่ 1: เลือกโรงเรียน */
  function renderSchools() {
    app.innerHTML = '<section class="card" style="display:grid;gap:12px">' +
      '<div><div class="step">ขั้นที่ 1 จาก 3</div><h2>เลือกโรงเรียน</h2></div>' +
      '<input type="search" id="q" placeholder="พิมพ์ค้นหาชื่อโรงเรียน" autocomplete="off">' +
      '<div class="school-list" id="schoolList"></div>' +
      '<p class="small muted" style="margin:0">ยืนยันได้จนถึงเวลาปิดของแต่ละรายการ' +
      (S.comp.max ? ' · นักกีฬา 1 คน ยืนยันได้ไม่เกิน ' + S.comp.max + ' รายการ' : '') + '</p></section>';
    document.getElementById('q').addEventListener('input', fillSchools);
    fillSchools();
  }
  function fillSchools() {
    var q = norm(document.getElementById('q').value);
    var list = S.schools.filter(function (s) { return !q || norm(s).indexOf(q) >= 0; });
    var box = document.getElementById('schoolList');
    box.innerHTML = list.length ? list.map(function (s) {
      return '<button class="school-btn" data-s="' + esc(s) + '"><span>' + esc(s) + '</span><span aria-hidden="true" class="muted">›</span></button>';
    }).join('') : '<p class="muted">ไม่พบโรงเรียนที่ค้นหา</p>';
    box.querySelectorAll('button').forEach(function (b) { b.onclick = function () { openSchool(b.getAttribute('data-s')); }; });
  }
  function openSchool(s) {
    app.innerHTML = '<div class="loading">กำลังโหลดรายชื่อ…</div>';
    return C.http('POST', base + '/school', { school: s }).then(function (v) {
      S.view = v; S.ev = null;
      var lv = C.levelsOf(v.events);
      if (lv.indexOf(S.level) < 0) S.level = lv[0] || '';
      renderEvents();
    }).catch(function (e) { app.innerHTML = '<div class="errors">' + esc(errMsg(e)) + '</div>'; });
  }

  /* ขั้นที่ 2: เลือกระดับและรายการ */
  function evStatus(e) {
    if (e.confirmation && e.confirmation.auto) return { cls: 'ok', text: 'ยืนยันอัตโนมัติ' };
    if (e.confirmation) return { cls: 'ok', text: 'ยืนยันแล้ว' };
    if (e.closed) return { cls: 'bad', text: 'ไม่ได้ยืนยัน' };
    return { cls: 'wait', text: 'รอยืนยัน' };
  }
  function renderEvents() {
    var v = S.view, levels = C.levelsOf(v.events);
    var tabs = levels.length > 1 ? '<div class="tabs" role="tablist" style="grid-template-columns:repeat(' + levels.length + ',1fr)">' + levels.map(function (l) {
      var evs = v.events.filter(function (e) { return e.level === l; });
      var done = evs.filter(function (e) { return e.confirmation; }).length;
      return '<button role="tab" data-l="' + esc(l) + '" aria-selected="' + (l === S.level) + '">' + esc(C.levelLabel(l)) +
        '<small class="num">ยืนยัน ' + done + '/' + evs.length + '</small></button>';
    }).join('') + '</div>' : '';
    var evs = v.events.filter(function (e) { return e.level === S.level; });
    var groups = {}, order = [];
    evs.forEach(function (e) { var k = e.startDate || ''; if (!groups[k]) { groups[k] = []; order.push(k); } groups[k].push(e); });
    var body = order.map(function (d) {
      var g = groups[d];
      return '<div class="day"><div class="day-h"><b>' + (d ? 'แข่ง' + thDate(d, true) : 'ยังไม่กำหนดวันแข่ง') + '</b><span>ปิดยืนยัน ' + thDateTime(g[0].deadline) + '</span></div>' +
        g.map(function (e) {
          var st = evStatus(e), n = e.entries.filter(function (x) { return x.status !== ST.OUT; }).length;
          return '<button class="ev" data-e="' + esc(e.event) + '"><span class="name">' + esc(e.short) + '</span>' +
            '<span class="pill ' + st.cls + '">' + st.text + '</span>' +
            '<span class="meta num">' + n + ' คน' + (e.confirmation ? (e.confirmation.auto ? ' · เลยเวลาปิด ใช้รายชื่อตามที่สมัคร' : ' · โดย ' + esc(e.confirmation.by) + ' ' + esc(thDateTime(e.confirmation.at))) : '') + '</span></button>';
        }).join('') + '</div>';
    }).join('');
    app.innerHTML = staffNote() + '<section class="card" style="display:grid;gap:14px">' +
      '<div class="row between"><div><div class="step">ขั้นที่ 2 จาก 3</div><h2>' + esc(v.school) + '</h2></div>' +
      '<button class="btn link" id="changeSchool">เปลี่ยนโรงเรียน</button></div>' + tabs +
      (body || '<p class="muted">ไม่มีรายการ</p>') + '</section>';
    document.getElementById('changeSchool').onclick = function () { S.view = null; renderSchools(); };
    app.querySelectorAll('.tabs button').forEach(function (b) { b.onclick = function () { S.level = b.getAttribute('data-l'); renderEvents(); }; });
    app.querySelectorAll('.ev').forEach(function (b) { b.onclick = function () { openEvent(b.getAttribute('data-e')); }; });
    window.scrollTo(0, 0);
  }
  function staffNote() {
    return S.staff ? '<div class="locked small">เข้าสู่ระบบเจ้าหน้าที่อยู่ แก้ไขได้แม้เลยเวลาปิดยืนยัน ไม่ต้องกรอกชื่อ/เบอร์ และไม่แสดงว่าเจ้าหน้าที่เป็นผู้แก้</div>' : '';
  }

  /* ขั้นที่ 3: ยืนยัน/แก้ไขรายชื่อ — แบ่งเป็นกล่องตามทีม/คู่ แต่ละกล่องมีช่องตามจำนวนที่กำหนด (รวมตัวสำรอง) */
  function tword() { return /คู่/.test(S.ev.category) ? 'คู่ที่' : 'ทีมที่'; }
  function openEvent(name) {
    S.ev = S.view.events.filter(function (x) { return x.event === name; })[0];
    S.errors = [];
    var size = S.ev.size || 1, teams = { '1': [], '2': [] }, extra = 0;
    S.ev.entries.forEach(function (x, i) {
      // ทีมตามไฟล์ถ้ามี ไม่มี (999) ให้เรียงลงทีม 1 ก่อน เต็มแล้วไปทีม 2
      var want = (x.team === '1' || x.team === '2') ? x.team : (size === 1 ? String(Math.min(i + 1, 2)) : (teams['1'].length < size ? '1' : '2'));
      var other = want === '1' ? '2' : '1';
      var t = teams[want].length < size ? want : (teams[other].length < size ? other : want);
      teams[t].push({ key: 'e' + x.id, id: x.id, team: t, entry: x, prefix: x.prefix, first: x.first, last: x.last, blank: x.status === ST.OUT });
    });
    S.shown = { '1': true, '2': teams['2'].length > 0 };
    S.slots = [];
    ['1', '2'].forEach(function (t) {
      while (teams[t].length < size) teams[t].push({ key: 'n' + (extra++), id: null, team: t, entry: null, prefix: '', first: '', last: '', blank: true });
      S.slots = S.slots.concat(teams[t]);
    });
    renderEditor();
  }
  function canEdit() { return !S.ev.closed || !!S.staff; }
  function slotByKey(k) { return S.slots.filter(function (s) { return s.key === k; })[0]; }
  function slotInfo(s) {
    var k = pkey(s.first, s.last), out = [], max = S.view.max, x = s.entry;
    if (s.blank) return { html: x ? '<span class="chip">ไม่ส่ง ไม่พิมพ์ในใบรายงานตัว และไม่นับรายการ</span>' : '', bad: false };
    var others = [], confirmedOthers = [];
    S.view.events.forEach(function (e) {
      if (e.event === S.ev.event) return;
      e.entries.forEach(function (y) {
        if (y.status === ST.OUT || pkey(y.first, y.last) !== k) return;
        others.push(e.short); if (y.status === ST.OK) confirmedOthers.push(e.short);
      });
    });
    var bad = max && confirmedOthers.length >= max, total = others.length + 1;
    if (bad) out.push('<span class="chip bad">ยืนยันครบ ' + max + ' รายการแล้ว: ' + esc(confirmedOthers.join(', ')) + '</span>');
    else out.push('<span class="chip' + (max && total > max ? ' warn' : '') + ' num">ลงแข่งรวม ' + total + ' รายการ' +
      (others.length ? ' (อีก: ' + esc(others.join(', ')) + ')' : '') + (max && total > max ? ' · เกิน ' + max + ' รายการ เปลี่ยนเป็นคนอื่นในบางรายการ' : '') + '</span>');
    if (x && x.oFirst && (s.prefix !== x.oPrefix || norm(s.first) !== norm(x.oFirst) || norm(s.last) !== norm(x.oLast)))
      out.push('<span class="chip edit">ชื่อเดิม: ' + esc(x.oPrefix + x.oFirst + ' ' + x.oLast) + '</span>');
    if (!x) out.push('<span class="chip edit">เพิ่มใหม่</span>');
    return { html: out.join(''), bad: bad };
  }
  function slotLabel(i, size) {
    if (size === 1) return 'นักกีฬา';
    return i === size - 1 ? 'คนที่ ' + (i + 1) + ' (สำรอง)' : 'คนที่ ' + (i + 1);
  }
  function renderEditor() {
    var e = S.ev, ed = canEdit(), st = evStatus(e), tw = tword(), size = e.size || 1, dis = ed ? '' : ' disabled';
    var head = e.confirmation && e.confirmation.auto ? '<div class="confirmed">ยืนยันอัตโนมัติ: ไม่มีการยืนยันก่อนปิด ' + esc(thDateTime(e.deadline)) + ' ระบบจึงใช้รายชื่อตามที่สมัครไว้</div>'
      : e.confirmation ? '<div class="confirmed">ยืนยันแล้วเมื่อ ' + esc(thDateTime(e.confirmation.at)) + ' โดย ' + esc(e.confirmation.by) +
      ' โทร ' + esc(e.confirmation.phone) + (ed && e.deadline ? '<br>แก้ไขและยืนยันซ้ำได้จนถึง ' + esc(thDateTime(e.deadline)) : '') + '</div>' : '';
    if (!ed) head += '<div class="locked">ปิดรับยืนยันรายการนี้แล้วเมื่อ ' + esc(thDateTime(e.deadline)) + ' หากต้องแก้ไข ติดต่อเจ้าหน้าที่</div>';
    else if (e.closed) head += '<div class="locked">เลยเวลาปิดยืนยันแล้ว กำลังแก้ไขในฐานะเจ้าหน้าที่</div>';
    var boxes = ['1', '2'].filter(function (t) { return S.shown[t]; }).map(function (t) {
      var list = S.slots.filter(function (s) { return s.team === t; });
      return '<div class="team"><div class="team-h">' + tw + ' ' + t + (size > 1 ? ' <span class="small" style="font-weight:400">(' + list.length + ' ช่อง' + (size > 1 ? ' รวมสำรอง' : '') + ')</span>' : '') + '</div>' +
        list.map(function (s, i) {
          var cur = pkey(s.first, s.last);
          return '<div class="slot pick" data-k="' + s.key + '">' +
            '<label class="f">' + slotLabel(i, size) + '<select class="who" id="w_' + s.key + '"' + dis + '>' +
            '<option value=""' + (s.blank ? ' selected' : '') + '>— ว่าง / ไม่ส่ง —</option>' +
            e.pool.map(function (p, j) {
              return '<option value="' + j + '"' + (!s.blank && pkey(p.first, p.last) === cur ? ' selected' : '') + '>' + esc(p.prefix + p.first + ' ' + p.last) + '</option>';
            }).join('') + '</select></label><div class="info"></div></div>';
        }).join('') + '</div>';
    }).join('');
    var addBtn = ed && !S.shown['2'] ? '<button class="btn" id="addTeam" style="justify-self:start">+ เพิ่ม' + tw + ' 2</button>' : '';
    app.innerHTML = staffNote() + '<section class="card" style="display:grid;gap:14px">' +
      '<div class="row between"><div><div class="step">ขั้นที่ 3 จาก 3 · ' + esc(S.view.school) + '</div><h2>' + esc(e.short) + '</h2>' +
      '<div class="small muted">' + esc(e.event) + (e.startDate ? ' · แข่ง' + thDate(e.startDate, true) : '') + (e.startTime ? ' เริ่ม ' + esc(e.startTime) + ' น.' : '') + '</div></div>' +
      '<span class="pill ' + st.cls + '">' + st.text + '</span></div>' +
      '<button class="btn link" id="back" style="justify-self:start">‹ กลับไปรายการทั้งหมด</button>' + head +
      '<div class="small muted" id="teamSum"></div>' +
      '<div style="display:grid;gap:18px">' + boxes + '</div>' + addBtn +
      (ed ? '<div class="sticky-bar"><div id="errBox"></div>' + (S.staff ? '' : '<div class="form2">' +
        '<label class="f">ชื่อผู้ยืนยัน/แก้ไข (ผู้ควบคุมทีม)<input type="text" id="by" value="' + esc(C.store('ck_by') || '') + '" autocomplete="name"></label>' +
        '<label class="f">เบอร์โทรศัพท์<input type="tel" id="phone" value="' + esc(C.store('ck_phone') || '') + '" inputmode="numeric" autocomplete="tel" placeholder="08xxxxxxxx"></label></div>') +
        '<button class="btn primary" id="submit">' + (S.staff ? 'บันทึกการแก้ไข' : e.confirmation ? 'บันทึกและยืนยันอีกครั้ง' : 'ยืนยันรายชื่อ') + '</button></div>' : '') + '</section>';
    document.getElementById('back').onclick = function () { S.ev = null; renderEvents(); };
    var add = document.getElementById('addTeam');
    if (add) add.onclick = function () { keepForm(); S.shown['2'] = true; renderEditor(); };
    app.querySelectorAll('.slot select.who').forEach(function (sel) {
      sel.addEventListener('change', function () {
        var s = slotByKey(sel.closest('.slot').getAttribute('data-k'));
        if (sel.value === '') s.blank = true;
        else { var p = e.pool[+sel.value]; s.prefix = p.prefix; s.first = p.first; s.last = p.last; s.blank = false; }
        updateSlots();
      });
    });
    if (ed) document.getElementById('submit').onclick = submit;
    updateSlots(); renderErrors();
  }
  function keepForm() {
    var b = document.getElementById('by'), ph = document.getElementById('phone');
    if (b) C.store('ck_by', b.value.trim()); if (ph) C.store('ck_phone', ph.value.trim());
  }
  function updateSlots() {
    var keys = {}, tw = tword(), cnt = { '1': 0, '2': 0 }, nout = 0;
    S.slots.forEach(function (s) {
      if (s.blank) { if (s.entry) nout++; return; }
      var k = pkey(s.first, s.last); keys[k] = (keys[k] || 0) + 1; cnt[s.team]++;
    });
    app.querySelectorAll('.slot').forEach(function (el) {
      var s = slotByKey(el.getAttribute('data-k')), info = slotInfo(s), dup = !s.blank && keys[pkey(s.first, s.last)] > 1;
      el.classList.toggle('over', !!info.bad); el.classList.toggle('dup', dup); el.classList.toggle('out', !!s.blank);
      el.querySelector('.info').innerHTML = info.html + (dup ? '<span class="chip bad">ชื่อซ้ำในรายการนี้</span>' : '');
    });
    var sum = document.getElementById('teamSum');
    if (sum) sum.textContent = 'ส่งแข่ง ' + tw + ' 1: ' + cnt['1'] + ' คน' + (S.shown['2'] ? ' · ' + tw + ' 2: ' + cnt['2'] + ' คน' : '') + (nout ? ' · ไม่ส่ง ' + nout + ' คน' : '');
  }
  function renderErrors() {
    var box = document.getElementById('errBox'); if (!box) return;
    box.innerHTML = S.errors.length ? '<div class="errors"><b>ยังบันทึกไม่ได้</b><ul>' + S.errors.map(function (m) { return '<li>' + esc(m) + '</li>'; }).join('') + '</ul></div>' : '';
  }
  function submit() {
    var btn = document.getElementById('submit');
    var bi = document.getElementById('by'), pi = document.getElementById('phone');
    var by = bi ? bi.value.trim() : '', phone = pi ? pi.value.trim() : '';
    if (bi) { C.store('ck_by', by); C.store('ck_phone', phone); }
    var payload = { school: S.view.school, event: S.ev.event, by: by, phone: phone,
      items: S.slots.filter(function (s) { return s.id || !s.blank; })
        .map(function (s) { return { id: s.id, team: s.team, prefix: s.prefix, first: s.first, last: s.last, withdrawn: !!s.blank }; }) };
    btn.disabled = true; btn.textContent = 'กำลังบันทึก…';
    C.http('POST', base + '/submit', payload).then(function (res) {
      if (!res.ok) { S.errors = res.errors; renderErrors(); btn.disabled = false; btn.textContent = 'ลองอีกครั้ง'; return; }
      S.view = res.view; S.ev = null; S.errors = [];
      renderEvents(); C.toast(res.conf ? 'ยืนยันรายชื่อแล้ว ' + res.conf.count + ' คน' : 'บันทึกการแก้ไขแล้ว (' + res.count + ' คน)');
    }).catch(function (e) { S.errors = [errMsg(e)]; renderErrors(); btn.disabled = false; btn.textContent = 'ลองอีกครั้ง'; });
  }

  C.http('GET', base + '/info').then(function (d) {
    S.comp = d.comp; S.schools = d.schools; S.events = d.events; S.staff = d.staff;
    renderHeader(); renderDeadlines(); setInterval(renderDeadlines, 60000);
    // ลิงก์จากหลังบ้าน: #s=โรงเรียน&e=รายการ เปิดตรงไปที่หน้าแก้ไข
    var h = {};
    location.hash.replace(/^#/, '').split('&').forEach(function (kv) { var i = kv.indexOf('='); if (i > 0) h[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1)); });
    if (h.s && S.schools.indexOf(h.s) >= 0) {
      openSchool(h.s).then(function () {
        var ev = h.e && S.view && S.view.events.filter(function (x) { return x.event === h.e; })[0];
        if (ev) { S.level = ev.level; openEvent(ev.event); }
      });
    } else renderSchools();
  }).catch(function (e) { app.innerHTML = '<div class="errors">โหลดข้อมูลไม่สำเร็จ: ' + esc(errMsg(e)) + '</div>'; });
})();
</script>
</body>
</html>
